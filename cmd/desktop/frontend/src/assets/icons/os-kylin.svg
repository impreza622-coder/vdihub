<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" aria-label="Kylin 银河麒麟 official logo (KylinOS: deep blue circular badge with Qilin unicorn head)">
  <!-- 银河麒麟 (Kylin / Ubuntu Kylin) official-style mark:
       - Deep cobalt-to-navy radial disk (Kylin brand blue)
       - White stylized Qilin (麒麟) head facing forward (mythical Chinese unicorn)
       - Accent gold star-spark (signifying "Galaxy" in银河 = Galaxy Qilin) -->
  <defs>
    <radialGradient id="kylin-bg" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0"   stop-color="#2E79E8"/>
      <stop offset="0.6" stop-color="#1355BE"/>
      <stop offset="1"   stop-color="#0A2E7A"/>
    </radialGradient>
  </defs>

  <!-- Outer blue disk with thin halo ring -->
  <circle cx="80" cy="80" r="76" fill="url(#kylin-bg)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- White Qilin (麒麟) head/crest — simplified stylized silhouette
       Key features: horse-face, single horn, deer antler branching, flowing mane -->
  <g fill="#FFFFFF">
    <!-- Qilin face/cheek area -->
    <path d="M58 96
             C52 90, 48 80, 50 68
             C52 58, 60 50, 72 46
             C84 42, 98 44, 108 52
             C116 58, 120 68, 118 78
             C116 88, 110 96, 100 102
             L100 114
             C96 118, 88 120, 80 120
             C72 120, 64 118, 60 114 Z"
          fill-rule="evenodd"/>
    <!-- Forehead/top-of-head horn (Qilin single horn) -->
    <path d="M78 44 C76 30, 74 18, 80 10
             C86 18, 84 30, 82 44 Z"
          opacity="0.95"/>
    <!-- Deer-like branching antlers (left) -->
    <path d="M62 50 C50 38, 40 32, 30 30
             C36 40, 46 48, 56 54 Z" opacity="0.92"/>
    <!-- Deer-like branching antlers (right) -->
    <path d="M98 50 C110 38, 120 32, 130 30
             C124 40, 114 48, 104 54 Z" opacity="0.92"/>
    <!-- Eyes (two dark pinpoints) -->
    <circle cx="68" cy="76" r="2.6" fill="#0A2E7A"/>
    <circle cx="92" cy="76" r="2.6" fill="#0A2E7A"/>
    <!-- Mouth/nose -->
    <path d="M74 92 C77 95, 83 95, 86 92
             C86 96, 82 98, 80 98 C78 98, 74 96, 74 92 Z" fill="#0A2E7A" opacity="0.7"/>
    <!-- Mane wisps along neck -->
    <path d="M56 106 C48 112, 42 120, 40 132
             C52 128, 58 120, 62 114 Z" opacity="0.9"/>
    <path d="M104 106 C112 112, 118 120, 120 132
             C108 128, 102 120, 98 114 Z" opacity="0.9"/>
  </g>

  <!-- Gold Galaxy sparkle (top-right corner) -->
  <g transform="translate(118,34)" fill="#FFD23F">
    <path d="M0 -10 L2.2 -2.2 L10 0 L2.2 2.2 L0 10 L-2.2 2.2 L-10 0 L-2.2 -2.2 Z"/>
  </g>
  <!-- Small secondary spark -->
  <g transform="translate(128,54) scale(0.6)" fill="#FFE066">
    <path d="M0 -10 L2.2 -2.2 L10 0 L2.2 2.2 L0 10 L-2.2 2.2 L-10 0 L-2.2 -2.2 Z"/>
  </g>

  <!-- Wordmark: 银河麒麟 (subtle curved below badge) -->
  <text x="80" y="150" text-anchor="middle"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"
        font-size="12" font-weight="700" fill="#FFFFFF" opacity="0.92">银河麒麟</text>
</svg>
